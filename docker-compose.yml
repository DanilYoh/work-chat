name: work-chat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workchat
      POSTGRES_USER: workchat
      POSTGRES_PASSWORD: workchat
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./infra/postgres/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workchat -d workchat"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["nats-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: workchat
      MINIO_ROOT_PASSWORD: workchat-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    profiles: ["search"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["identity"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak/work-chat-realm.json:/opt/keycloak/data/import/work-chat-realm.json:ro

  livekit:
    image: livekit/livekit-server:latest
    profiles: ["calls"]
    command: ["--config", "/etc/livekit.yaml"]
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
    volumes:
      - ./infra/livekit/livekit.local.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  opensearch-data:

